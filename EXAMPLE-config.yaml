general:
  repository_path: ssh://user@server.example.com
  repository_port: 23
  repository_name: my-backups
  private_key_path: /root/.ssh/id_rsa
  repository_passphrase: secret
  borg_prune_params:
    - --keep-within=14d
    - --keep-weekly=7
    - --keep-monthly=10

jobs:
  files:
    source: files
    cron: "0 3 * * *"
    config:
      include: [./src]
      exclude: [./tmp, ./logs, ./.locks, ./venv]

  postgresql:
    source: postgresql
    cron: "30 3 * * *"
    # Optional: replaces the general policy. [] disables pruning and compaction.
    # borg_prune_params: [--keep-last=7]
    config:
      host: 127.0.0.1
      port: 5432
      user: backup
      password: change-me
      database: application
      docker_container: null
      dump_dir: /tmp
